<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everylight Co. Intro</title>
<style>
  :root { --bg:#050505; --fg:#cfc8b8; --dim:#6d675c; --accent:#d9b77a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: "Courier New", ui-monospace, monospace; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; }
  #stage { position:relative; width:min(100%, calc((100vh - 120px) * 4 / 3)); aspect-ratio:4/3; }
  canvas { display:block; width:100%; height:100%; background:#000; border-radius:6px; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; background:rgba(0,0,0,.72); cursor:pointer; border-radius:6px; text-align:center; padding:16px; }
  #overlay b { font-size:clamp(18px,3vw,30px); letter-spacing:.15em; color:var(--accent); }
  #overlay span { font-size:13px; color:var(--dim); }
  #overlay.hidden { display:none; }
  #bar { width:min(100%, calc((100vh - 120px) * 4 / 3)); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { background:#151412; color:var(--fg); border:1px solid #2d2a25; border-radius:4px; padding:6px 10px;
    font:inherit; font-size:14px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  input[type=range] { flex:1; min-width:120px; accent-color:var(--accent); }
  #time { font-size:13px; color:var(--dim); min-width:120px; text-align:right; font-variant-numeric:tabular-nums; }
  #hint { width:min(100%, calc((100vh - 120px) * 4 / 3)); font-size:12px; color:var(--dim); margin:0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="960" height="720"></canvas>
  <div id="overlay"><b>▶ EVERYLIGHT CO.</b><span id="ovsub">Ses hazırlanıyor…</span></div>
</div>
<div id="bar">
  <button id="play" title="Oynat / Duraklat (Boşluk)">▶</button>
  <button id="back" title="Bir kare geri (←)">◀▮</button>
  <button id="fwd" title="Bir kare ileri (→)">▮▶</button>
  <input id="seek" type="range" min="0" max="15" step="0.041666" value="0">
  <span id="time">00:00.00 · kare 0</span>
  <button id="rec" title="15 saniyelik videoyu .webm olarak kaydet">⏺ Kaydet</button>
</div>
<p id="hint">Boşluk: oynat/duraklat · ← →: kare kare ilerle · Dikkatli izleyiciler 0:05'te durdurmalı.</p>

<script>
"use strict";
// ---------------------------------------------------------------------------
// Basics
// ---------------------------------------------------------------------------
const W = 960, H = 720, FPS = 24, DUR = 15, FRAMES = DUR * FPS;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function mkCanvas(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rng(seed) { // mulberry32
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };

// Timeline (seconds)
const T = {
  glitchStart: 5.0, glitchEnd: 5.5,   // 0.5 s glitch
  broadcast: 6.0,                     // emergency broadcast
  closing: 12.0,
};

// ---------------------------------------------------------------------------
// Emergency broadcast text + typewriter schedule (shared by video and audio)
// ---------------------------------------------------------------------------
const HEADER = "Everylight Co. Yönetim Kurulu Bilgilendirmesidir.";
const BODY = [
  "Okul binası içerisinde geceleri duyulduğu rapor edilen sesler ve görüldüğü iddia edilen anomaliler tamamen hayal ürünüdür.",
  "Bölgedeki tesisleşme çalışmaları tamamen güvenlidir ve öğrencilerimiz koruma altındadır.",
];
const HEADER_AT = 6.15;
const schedule = (() => { // per paragraph: array of char reveal times
  const r = rng(1961), out = [];
  let t = 6.75;
  for (const p of BODY) {
    const times = [];
    for (let i = 0; i < p.length; i++) {
      times.push(t);
      const ch = p[i];
      t += (1 / 50) * (0.7 + r() * 0.6) + (ch === ',' ? 0.05 : 0);
    }
    out.push(times);
    t += 0.35; // carriage return pause
  }
  return out;
})();

// ---------------------------------------------------------------------------
// Pre-rendered textures
// ---------------------------------------------------------------------------
const noiseFrames = [], staticFrames = [];
(function makeNoise() {
  const r = rng(7);
  for (let k = 0; k < 8; k++) {
    for (const opaque of [false, true]) {
      const c = mkCanvas(320, 240), g = c.getContext('2d');
      const img = g.createImageData(320, 240), d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = r() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = opaque ? 255 : 255 * r();
      }
      g.putImageData(img, 0, 0);
      (opaque ? staticFrames : noiseFrames).push(c);
    }
  }
})();

const scanlines = (() => { const c = mkCanvas(), g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0.16)'; for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1); return c; })();
const vignette = (() => { const c = mkCanvas(), g = c.getContext('2d');
  const grd = g.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.85);
  grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(0,0,0,0.75)');
  g.fillStyle = grd; g.fillRect(0, 0, W, H); return c; })();
const crtMask = (() => { const c = mkCanvas(), g = c.getContext('2d');
  g.fillStyle = '#000'; g.beginPath(); g.rect(0, 0, W, H); g.roundRect(14, 12, W - 28, H - 24, 46); g.fill('evenodd'); return c; })();

// ---------------------------------------------------------------------------
// Scene 1: 1960s archive photos of Everylight Co.
// ---------------------------------------------------------------------------
const SEPIA = { ink: '#2e2116', dark: '#4a3523', mid: '#7a5c3e', brick: '#8b6644', light: '#d8c29a', paper: '#efe2c4' };

function drawKid(g, x, y, s, ph, girl) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.strokeStyle = g.fillStyle = SEPIA.ink; g.lineWidth = 5; g.lineCap = 'round'; g.lineJoin = 'round';
  const a = Math.sin(ph) * 0.8, hipX = 0, hipY = -38, nx = 5, ny = -66;
  const leg = (ang) => { g.beginPath(); g.moveTo(hipX, hipY);
    const kx = hipX + Math.sin(ang) * 14, ky = hipY + Math.cos(ang) * 16;
    g.lineTo(kx, ky); g.lineTo(kx + Math.sin(ang - 0.6) * 14, ky + 18); g.stroke(); };
  leg(a); leg(-a);
  g.beginPath(); g.moveTo(hipX, hipY); g.lineTo(nx, ny); g.stroke();
  if (girl) { g.beginPath(); g.moveTo(nx - 2, ny + 6); g.lineTo(-13, hipY + 6); g.lineTo(15, hipY + 6); g.closePath(); g.fill(); }
  const arm = (ang) => { g.beginPath(); g.moveTo(nx, ny + 3);
    const ex = nx + Math.sin(ang) * 13, ey = ny + 3 + Math.cos(ang) * 13; g.lineTo(ex, ey);
    g.lineTo(ex + Math.sin(ang + 1.2) * 11, ey - 4); g.stroke(); };
  arm(-a * 1.3); arm(a * 1.3);
  g.beginPath(); g.arc(nx + 3, ny - 11, 9, 0, Math.PI * 2); g.fill();
  if (girl) { g.beginPath(); g.arc(nx - 7, ny - 12, 4, 0, 7); g.arc(nx + 13, ny - 12, 4, 0, 7); g.fill(); }
  g.restore();
}

function drawBuilding(g, x, y, w, h, haunted) {
  // y = ground line
  const top = y - h;
  g.fillStyle = SEPIA.brick; g.fillRect(x, top, w, h);
  g.strokeStyle = 'rgba(46,33,22,0.18)'; g.lineWidth = 1;
  for (let yy = top + 6; yy < y; yy += 7) { g.beginPath(); g.moveTo(x, yy); g.lineTo(x + w, yy); g.stroke(); }
  g.fillStyle = SEPIA.dark; g.fillRect(x - 8, top - 14, w + 16, 16);       // cornice
  // tower
  const tw = w * 0.15, tx = x + w / 2 - tw / 2, th = h * 0.6;
  g.fillStyle = SEPIA.brick; g.fillRect(tx, top - th, tw, th);
  g.fillStyle = SEPIA.dark; g.beginPath(); g.moveTo(tx - 10, top - th); g.lineTo(tx + tw / 2, top - th - tw * 0.8);
  g.lineTo(tx + tw + 10, top - th); g.closePath(); g.fill();
  g.fillStyle = SEPIA.paper; g.beginPath(); g.arc(tx + tw / 2, top - th * 0.55, tw * 0.28, 0, 7); g.fill();
  g.strokeStyle = SEPIA.ink; g.lineWidth = Math.max(1.5, tw * 0.03); g.stroke();
  g.beginPath(); g.moveTo(tx + tw / 2, top - th * 0.55); g.lineTo(tx + tw / 2, top - th * 0.55 - tw * 0.2);
  g.moveTo(tx + tw / 2, top - th * 0.55); g.lineTo(tx + tw / 2 + tw * 0.14, top - th * 0.55); g.stroke();
  // windows
  const cols = 12, rows = 3, ww = w / cols * 0.5, wh = h / rows * 0.48;
  let n = 0;
  for (let r = 0; r < rows; r++) for (let cI = 0; cI < cols; cI++) {
    const wx = x + (cI + 0.25) * (w / cols), wy = top + (r + 0.22) * (h / rows);
    if (r === rows - 1 && (cI === 5 || cI === 6)) continue; // door space
    g.fillStyle = '#2a1d12'; g.fillRect(wx, wy, ww, wh);
    g.strokeStyle = SEPIA.light; g.lineWidth = Math.max(1, ww * 0.08);
    g.strokeRect(wx, wy, ww, wh);
    g.beginPath(); g.moveTo(wx + ww / 2, wy); g.lineTo(wx + ww / 2, wy + wh); g.moveTo(wx, wy + wh / 2); g.lineTo(wx + ww, wy + wh / 2); g.stroke();
    if (haunted && r === 0 && cI === 9) { // a pale figure behind a top-floor window
      g.save(); g.globalAlpha = haunted; g.fillStyle = '#e9dcc0';
      g.beginPath(); g.ellipse(wx + ww * 0.5, wy + wh * 0.38, ww * 0.18, wh * 0.16, 0, 0, 7); g.fill();
      g.fillRect(wx + ww * 0.3, wy + wh * 0.55, ww * 0.4, wh * 0.45);
      g.fillRect(wx + ww * 0.08, wy + wh * 0.1, ww * 0.12, wh * 0.18); g.fillRect(wx + ww * 0.8, wy + wh * 0.1, ww * 0.12, wh * 0.18);
      g.restore();
    }
    n++;
  }
  // door + sign
  const dx = x + w / 2 - w * 0.06, dw = w * 0.12, dh = h * 0.3;
  g.fillStyle = SEPIA.ink; g.beginPath(); g.moveTo(dx, y); g.lineTo(dx, y - dh * 0.7);
  g.arc(dx + dw / 2, y - dh * 0.7, dw / 2, Math.PI, 0); g.lineTo(dx + dw, y); g.closePath(); g.fill();
  g.fillStyle = SEPIA.paper; const sw = w * 0.3, sh = h * 0.09;
  g.fillRect(x + w / 2 - sw / 2, y - dh - sh - 8, sw, sh);
  g.fillStyle = SEPIA.ink; g.font = `bold ${Math.round(sh * 0.62)}px Georgia, serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('EVERYLIGHT CO.', x + w / 2, y - dh - sh / 2 - 8);
}

function drawTree(g, x, y, s) {
  g.fillStyle = SEPIA.dark; g.fillRect(x - 5 * s, y - 60 * s, 10 * s, 60 * s);
  g.fillStyle = SEPIA.mid;
  for (const [ox, oy, r] of [[0, -95, 45], [-30, -75, 32], [30, -72, 34], [0, -130, 30]]) {
    g.beginPath(); g.arc(x + ox * s, y + oy * s, r * s, 0, 7); g.fill();
  }
}

const PHOTOS = [
  { bx: 90, by: 395, bw: 780, bh: 200, kids: 8, seed: 11 },
  { bx: -260, by: 340, bw: 1480, bh: 270, kids: 5, seed: 23 },
  { bx: 150, by: 410, bw: 660, bh: 185, kids: 9, seed: 37, haunted: true },
];

function drawPhoto(g, idx, p, t) {
  const P = PHOTOS[idx], r = rng(P.seed);
  g.save();
  const z = 1.04 + 0.07 * p, panX = (idx % 2 ? -1 : 1) * 30 * (p - 0.5);
  g.translate(W / 2 + panX, H / 2); g.scale(z, z); g.translate(-W / 2, -H / 2);
  const sky = g.createLinearGradient(0, 0, 0, P.by);
  sky.addColorStop(0, SEPIA.paper); sky.addColorStop(1, SEPIA.light);
  g.fillStyle = sky; g.fillRect(-50, -50, W + 100, P.by + 60);
  g.fillStyle = 'rgba(255,248,230,0.5)';
  for (let i = 0; i < 4; i++) { const cx = r() * W, cy = 40 + r() * 120;
    g.beginPath(); g.ellipse(cx, cy, 80 + r() * 60, 16 + r() * 10, 0, 0, 7); g.fill(); }
  drawTree(g, P.bx - 40, P.by, 1.1); drawTree(g, P.bx + P.bw + 40, P.by, 1.2);
  drawBuilding(g, P.bx, P.by, P.bw, P.bh, P.haunted ? smooth(0.35, 0.8, p) * 0.55 : 0);
  const lawn = g.createLinearGradient(0, P.by, 0, H);
  lawn.addColorStop(0, '#b9a176'); lawn.addColorStop(1, '#94794f');
  g.fillStyle = lawn; g.fillRect(-50, P.by, W + 100, H - P.by + 50);
  g.fillStyle = '#c9b48b'; g.beginPath(); g.moveTo(W / 2 - 40, P.by); g.lineTo(W / 2 + 40, P.by);
  g.lineTo(W / 2 + 220, H + 20); g.lineTo(W / 2 - 220, H + 20); g.closePath(); g.fill();
  const kids = [];
  for (let i = 0; i < P.kids; i++) {
    const ky = P.by + 50 + r() * (H - P.by - 80);
    kids.push({ x: 40 + r() * (W - 80), y: ky, s: lerp(0.7, 1.9, (ky - P.by) / (H - P.by)), ph: r() * 6.28, girl: r() > 0.5 });
  }
  kids.sort((a, b) => a.y - b.y);
  for (const k of kids) {
    g.fillStyle = 'rgba(46,33,22,0.18)'; g.beginPath(); g.ellipse(k.x, k.y + 2, 16 * k.s, 4 * k.s, 0, 0, 7); g.fill();
    drawKid(g, k.x, k.y, k.s, k.ph, k.girl);
  }
  g.restore();
  // white photo border, slightly worn
  g.strokeStyle = 'rgba(245,236,214,0.9)'; g.lineWidth = 22; g.strokeRect(11, 11, W - 22, H - 22);
}

const schoolC = mkCanvas(), schoolG = schoolC.getContext('2d');
function renderSchool(t) {
  const dur = 5 / 3, k = Math.min(2, Math.floor(t / dur)), p = (t - k * dur) / dur;
  schoolG.globalAlpha = 1; drawPhoto(schoolG, k, p, t);
  if (k < 2 && p > 0.82) { schoolG.globalAlpha = smooth(0.82, 1, p); drawPhoto(schoolG, k + 1, 0, t); }
  schoolG.globalAlpha = 1;
}

function drawAdScene(g, t, f, r) {
  renderSchool(t);
  // "parasitic" tape wobble, growing over time
  const wob = 1 + 9 * smooth(1.5, 5, t) ** 2, jit = (r() - 0.5) * 2;
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += 6) {
    const off = Math.sin(y * 0.021 + t * 9) * wob * 0.5 + Math.sin(y * 0.11 + t * 31) * wob * 0.25 + jit;
    g.drawImage(schoolC, 0, y, W, 6, off, y, W, 6);
  }
  // sepia wash + fade
  g.globalCompositeOperation = 'multiply'; g.fillStyle = '#e8c999'; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'screen'; g.fillStyle = 'rgba(70,45,20,0.22)'; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = `rgba(20,10,0,${0.03 + r() * 0.07})`; g.fillRect(0, 0, W, H);  // projector flicker
  // advertisement logo
  const la = smooth(0.2, 0.9, t);
  g.save(); g.globalAlpha = la; g.translate(W / 2, 612);
  g.fillStyle = 'rgba(250,232,190,0.85)';
  for (let i = 0; i < 18; i++) { g.rotate(Math.PI / 9); g.beginPath(); g.moveTo(0, -6); g.lineTo(150, -2); g.lineTo(150, 2); g.lineTo(0, 6); g.fill(); }
  g.restore();
  g.save(); g.globalAlpha = la; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = 'italic bold 58px Georgia, "Times New Roman", serif';
  g.lineWidth = 7; g.strokeStyle = '#3a2615'; g.strokeText('Everylight Co.', W / 2, 610);
  g.fillStyle = '#fbf0d6'; g.fillText('Everylight Co.', W / 2, 610);
  g.globalAlpha = smooth(0.9, 1.5, t); g.font = 'bold 24px Georgia, serif';
  g.lineWidth = 5; g.strokeText('Her çocuğa parlak bir gelecek!', W / 2, 662);
  g.fillText('Her çocuğa parlak bir gelecek!', W / 2, 662);
  g.restore();
  // scratches + dust
  g.strokeStyle = 'rgba(255,245,220,0.35)'; g.lineWidth = 1;
  for (let i = 0, n = Math.floor(r() * 3); i < n; i++) { const x = r() * W; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + (r() - 0.5) * 8, H); g.stroke(); }
  g.fillStyle = 'rgba(30,20,10,0.6)';
  for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(r() * W, r() * H, r() * 2.5, 0, 7); g.fill(); }
  grain(g, f, 0.16);
}

// ---------------------------------------------------------------------------
// Scene 2: the -1 floor (static frame, distorted at composite time)
// ---------------------------------------------------------------------------
function blob(g, cx, cy, rx, ry, seed, col) {
  const r = rng(seed), n = 16; g.fillStyle = col; g.beginPath();
  for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2, k = 0.6 + r() * 0.55;
    const x = cx + Math.cos(a) * rx * k, y = cy + Math.sin(a) * ry * k; i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.closePath(); g.fill();
}
function bloodPool(g, cx, cy, rx, ry, seed) {
  blob(g, cx, cy, rx, ry, seed, '#4a0000');
  blob(g, cx, cy, rx * 0.75, ry * 0.7, seed + 1, '#6e0303');
  g.fillStyle = 'rgba(255,220,220,0.12)'; g.beginPath(); g.ellipse(cx - rx * 0.25, cy - ry * 0.2, rx * 0.2, ry * 0.12, -0.3, 0, 7); g.fill();
}
function drip(g, x, y, len, w, col) {
  g.strokeStyle = g.fillStyle = col; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + len); g.stroke();
  g.beginPath(); g.arc(x, y + len, w * 0.9, 0, 7); g.fill();
}
function drawTable(g, cx, y, w, d, legH, seed) {
  const vx = (480 - cx) * 0.08;
  g.fillStyle = '#1c201e';
  for (const lx of [cx - w / 2 + 12, cx + w / 2 - 12]) g.fillRect(lx - 5, y + d, 10, legH);
  for (const lx of [cx - w / 2 + 12 + vx, cx + w / 2 - 12 + vx]) g.fillRect(lx - 4, y + 6, 8, legH - 10);
  const top = g.createLinearGradient(cx - w / 2, y, cx + w / 2, y + d);
  top.addColorStop(0, '#7f8b86'); top.addColorStop(0.5, '#3b433f'); top.addColorStop(1, '#66716c');
  g.fillStyle = top; g.beginPath();
  g.moveTo(cx - w / 2 + 30 + vx, y); g.lineTo(cx + w / 2 - 30 + vx, y); g.lineTo(cx + w / 2, y + d); g.lineTo(cx - w / 2, y + d); g.closePath(); g.fill();
  g.fillStyle = '#262b29'; g.fillRect(cx - w / 2, y + d, w, 10);
  g.fillStyle = 'rgba(140,255,100,0.10)'; g.fillRect(cx - w / 2 + 20, y + d * 0.25, w - 40, 5);
  g.strokeStyle = '#2a1e14'; g.lineWidth = 7;  // restraints
  for (const k of [0.3, 0.7]) { g.beginPath(); g.moveTo(cx - w / 2 + w * k + vx * 0.9, y); g.lineTo(cx - w / 2 + w * k, y + d + 10); g.stroke(); }
  const r = rng(seed);
  bloodPool(g, cx + (r() - 0.5) * w * 0.4, y + d * 0.5, w * 0.28, d * 0.32, seed);
  for (let i = 0; i < 5; i++) drip(g, cx - w * 0.2 + r() * w * 0.4, y + d + 4, 14 + r() * 50, 3 + r() * 3, '#5a0101');
  bloodPool(g, cx + (r() - 0.5) * 40, y + d + legH + 6, w * 0.3, 12, seed + 9);
}
function handprint(g, x, y, s, rot, seed) {
  const r = rng(seed);
  g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = g.strokeStyle = 'rgba(122,4,4,0.92)'; g.lineCap = 'round';
  g.beginPath(); g.ellipse(0, 0, 16 * s, 19 * s, 0, 0, 7); g.fill();
  g.lineWidth = 7 * s;
  for (let i = 0; i < 5; i++) { const a = -2.4 + i * 0.42 + (i === 0 ? -0.35 : 0), L = (i === 0 ? 22 : 30) * s;
    g.beginPath(); g.moveTo(Math.cos(a) * 12 * s, Math.sin(a) * 14 * s); g.lineTo(Math.cos(a) * (12 * s + L), Math.sin(a) * (14 * s + L)); g.stroke(); }
  g.restore();
  for (let i = 0; i < 4; i++) drip(g, x - 12 * s + r() * 24 * s, y + 10 * s, 30 + r() * 110, 2 + r() * 4, 'rgba(110,3,3,0.9)');
  g.strokeStyle = 'rgba(100,0,0,0.45)'; g.lineWidth = 20 * s; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, y + 14); g.quadraticCurveTo(x + (r() - 0.5) * 40, y + 60, x + (r() - 0.5) * 30, y + 130); g.stroke();
}
function trefoil(g, x, y, s) {

  cry.type = 'sawtooth'; cry.frequency.setValueAtTime(720, 13.0); cry.frequency.linearRampToValueAtTime(1250, 13.6); cry.frequency.linearRampToValueAtTime(860, 14.6);
  cv.frequency.value = 6.5; cvg.gain.value = 35; cv.connect(cvg); cvg.connect(cry.frequency);
  cbp.type = 'bandpass'; cbp.frequency.value = 1100; cbp.Q.value = 5;
  cgn.gain.setValueAtTime(0, 13.0); cgn.gain.linearRampToValueAtTime(0.018, 13.6); cgn.gain.linearRampToValueAtTime(0, 14.7);
  cry.connect(cbp); cbp.connect(cgn); cgn.connect(master);
  cry.start(13.0); cv.start(13.0); cry.stop(14.8); cv.stop(14.8);

  return oc.startRendering();
}

// ---------------------------------------------------------------------------
// Player
// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const ui = { play: $('play'), back: $('back'), fwd: $('fwd'), seek: $('seek'), time: $('time'), rec: $('rec'), overlay: $('overlay'), ovsub: $('ovsub') };
let audioBuf = null, actx = null, src = null, playing = false, offset = 0, ctxStart = 0, perfStart = 0, lastFrame = -1;
let recorder = null, recDest = null, recChunks = [];

const now = () => {
  if (!playing) return offset;
  const el = actx && audioBuf ? actx.currentTime - ctxStart : (performance.now() - perfStart) / 1000;
  return Math.min(DUR, offset + el);
};
function play() {
  if (offset >= DUR - 1 / FPS) offset = 0;
  if (!actx) { try { actx = new AudioContext(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
  if (actx && audioBuf) {
    src = actx.createBufferSource(); src.buffer = audioBuf; src.connect(actx.destination);
    if (recDest) src.connect(recDest);
    src.start(0, offset); ctxStart = actx.currentTime;
  }
  perfStart = performance.now(); playing = true; ui.play.textContent = '❚❚'; ui.overlay.classList.add('hidden');
}
function pause() {
  offset = now(); playing = false; ui.play.textContent = '▶';
  if (src) { try { src.stop(); } catch (e) {} src.disconnect(); src = null; }
}
function seek(t) { const was = playing; if (was) pause(); offset = clamp(t, 0, DUR); lastFrame = -1; if (was) play(); }
function step(d) { if (playing) pause(); seek((Math.round(offset * FPS) + d) / FPS); }
const fmt = (t) => { const m = Math.floor(t / 60), s = t - m * 60; return `${String(m).padStart(2, '0')}:${s.toFixed(2).padStart(5, '0')}`; };

function tick() {
  let t = now();
  if (playing && t >= DUR) { pause(); offset = DUR; t = DUR; if (recorder) recorder.stop(); else showReplay(); }
  const f = Math.min(FRAMES - 1, Math.floor(t * FPS + 1e-6));
  if (f !== lastFrame) { render(f); lastFrame = f; ui.seek.value = (f / FPS).toFixed(4); ui.time.textContent = `${fmt(f / FPS)} · kare ${f}`; }
  requestAnimationFrame(tick);
}
function showReplay() { ui.ovsub.textContent = 'Tekrar izlemek için tıkla'; ui.overlay.classList.remove('hidden'); }

ui.overlay.addEventListener('click', () => { if (audioBuf || ui.ovsub.dataset.noaudio) play(); });
ui.play.addEventListener('click', () => (playing ? pause() : play()));
ui.back.addEventListener('click', () => step(-1));
ui.fwd.addEventListener('click', () => step(1));
ui.seek.addEventListener('input', () => { if (playing) pause(); seek(parseFloat(ui.seek.value)); ui.overlay.classList.add('hidden'); });
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
  else if (e.code === 'ArrowLeft' || e.key === ',') { e.preventDefault(); step(-1); }
  else if (e.code === 'ArrowRight' || e.key === '.') { e.preventDefault(); step(1); }
});
ui.rec.addEventListener('click', () => {
  if (recorder || !window.MediaRecorder) return;
  if (!actx) actx = new AudioContext();
  recDest = actx.createMediaStreamDestination();
  const stream = new MediaStream([...canvas.captureStream(FPS).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {}); recChunks = [];
  recorder.ondataavailable = (e) => e.data.size && recChunks.push(e.data);
  recorder.onstop = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(recChunks, { type: 'video/webm' }));
    a.download = 'everylight-intro.webm'; a.click();
    recorder = null; recDest = null; ui.rec.disabled = false; ui.rec.textContent = '⏺ Kaydet'; showReplay();
  };
  ui.rec.disabled = true; ui.rec.textContent = '⏺ Kaydediliyor…';
  pause(); offset = 0; recorder.start(); play();
});

render(0); requestAnimationFrame(tick);
renderAudio().then((b) => { audioBuf = b; ui.ovsub.textContent = 'İzlemek için tıkla · 0:15'; })
  .catch(() => { ui.ovsub.dataset.noaudio = '1'; ui.ovsub.textContent = 'Ses başlatılamadı — sessiz izlemek için tıkla'; });
</script>
</body>
